name: Exploration (manuel)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Liquidations Paris et petite couronne, 35 jours
        run: |
          DEBUT=$(date -d '35 days ago' +%F)
          curl --fail --retry 3 -sS -G \
            "https://bodacc-datadila.opendatasoft.com/api/explore/v2.1/catalog/datasets/annonces-commerciales/exports/csv" \
            --data-urlencode "where=familleavis=\"collective\" and (numerodepartement=\"75\" or numerodepartement=\"92\" or numerodepartement=\"93\" or numerodepartement=\"94\") and dateparution>=date'${DEBUT}'" \
            -o annonces.csv
      - name: Enrichir
        run: |
          python3 prepare.py annonces.csv data.json
          python3 enrich.py data.json enrichi.json --deps 75,92,93,94
          echo "===DEBUT==="; python3 -c "import json;print(json.dumps(json.load(open('enrichi.json')),ensure_ascii=False))"; echo "===FIN==="
