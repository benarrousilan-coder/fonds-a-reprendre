name: Mise a jour hebdomadaire du site

on:
  schedule:
    - cron: "0 5 * * 1"   # chaque lundi a 6h (heure de Paris en hiver)
  workflow_dispatch:       # bouton "Run workflow" pour lancer a la main
    inputs:
      alertes:
        description: "Alertes : non = ne rien envoyer, test = apercu sans envoi, oui = envoyer aux abonnes"
        default: "non"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://benarrousilan-coder.github.io
      ROOT_PATH: /fonds-a-reprendre/
      STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
      BREVO_KEY: ${{ secrets.BREVO_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Telecharger les liquidations des 35 derniers jours, toute la France (BODACC)
        run: |
          DEBUT=$(date -d '35 days ago' +%F)
          curl --fail --retry 3 -sS -G \
            "https://bodacc-datadila.opendatasoft.com/api/explore/v2.1/catalog/datasets/annonces-commerciales/exports/csv" \
            --data-urlencode "where=familleavis=\"collective\" and dateparution>=date'${DEBUT}'" \
            --data-urlencode "order_by=dateparution desc" \
            -o annonces.csv
          wc -l annonces.csv

      - name: Construire le site
        run: |
          python3 prepare.py annonces.csv data.json
          python3 enrich.py data.json data.json
          python3 build.py data.json template.html site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Envoyer les alertes aux abonnes
        if: ${{ (github.event_name == 'schedule' || inputs.alertes == 'oui' || inputs.alertes == 'test') && env.STRIPE_KEY != '' }}
        env:
          SITE_URL: ${{ env.BASE_URL }}${{ env.ROOT_PATH }}
          DRY_RUN: ${{ inputs.alertes == 'test' && '1' || '0' }}
        run: python3 alertes.py data.json
